<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>이미지 순서 정렬기</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              gray: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                400: '#94a3b8',
                500: '#64748b',
                600: '#475569',
                700: '#334155',
                800: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        --primary-500: #3b82f6;
        --primary-600: #2563eb;
        --secondary-500: #64748b;
        --secondary-600: #475569;
        --red-500: #ef4444;
        --red-600: #dc2626;

        --bg-light: #f1f5f9;
        --bg-dark: #0f172a;
        --card-bg-light: #ffffff;
        --card-bg-dark: #1e293b;
        --text-primary-light: #1e293b;
        --text-primary-dark: #e2e8f0;
        --text-secondary-light: #475569;
        --text-secondary-dark: #94a3b8;
        --border-light: #e2e8f0;
        --border-dark: #334155;
      }

      body {
        background-color: var(--bg-light);
        color: var(--text-primary-light);
        transition: background-color 0.3s, color 0.3s;
      }

      .dark body {
        background-color: var(--bg-dark);
        color: var(--text-primary-dark);
      }
      
      .app-container {
        max-width: 1280px;
        margin: 0 auto;
        padding: 1rem;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1rem 1.5rem;
        background-color: rgba(255,255,255,0.8);
        border-radius: 0.75rem;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        backdrop-filter: blur(8px);
        position: sticky;
        top: 1rem;
        z-index: 10;
      }
      .dark header {
        background-color: rgba(30, 41, 59, 0.8);
        border: 1px solid var(--border-dark);
      }
      header h1 {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--text-primary-light);
      }
      .dark header h1 {
        color: var(--text-primary-dark);
      }
      header p {
        margin-top: 0.25rem;
        font-size: 0.875rem;
        color: var(--text-secondary-light);
      }
      .dark header p {
        color: var(--text-secondary-dark);
      }

      main {
        margin-top: 2rem;
        display: flex;
        flex-direction: column;
        gap: 2rem;
      }

      .card-container {
        padding: 1.5rem;
        background-color: var(--card-bg-light);
        border-radius: 0.75rem;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
      }
      .dark .card-container {
        background-color: var(--card-bg-dark);
      }
      
      .upload-area-actions {
        display: flex;
        justify-content: flex-start;
        align-items: center;
        flex-wrap: wrap;
        gap: 1rem;
        margin-bottom: 1.5rem;
      }

      .section-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
        gap: 1rem;
      }

      .section-header h2 {
        font-size: 1.25rem;
        font-weight: 600;
      }

      .section-header p {
         color: var(--text-secondary-light);
         font-size: 0.875rem;
      }

       .dark .section-header p {
         color: var(--text-secondary-dark);
      }
      
      .action-buttons-group {
        display: flex;
        gap: 0.75rem;
        flex-wrap: wrap;
      }

      .action-button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.625rem 1.25rem;
        border-radius: 0.5rem;
        font-weight: 600;
        transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
        border: none;
        cursor: pointer;
      }
      .action-button:hover {
        transform: translateY(-2px);
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      }
      .action-button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
        box-shadow: none;
      }
      .action-button.primary {
        background-color: var(--primary-500);
        color: white;
      }
       .action-button.primary:hover:not(:disabled) {
        background-color: var(--primary-600);
       }
      .action-button.secondary {
        background-color: var(--secondary-500);
        color: white;
      }
      .action-button.secondary:hover:not(:disabled) {
        background-color: var(--secondary-600);
      }
      .action-button.danger {
        background-color: var(--red-500);
        color: white;
      }
      .action-button.danger:hover:not(:disabled) {
        background-color: var(--red-600);
      }

      .image-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
        gap: 1rem;
      }

      .image-grid-item {
        position: relative;
        aspect-ratio: 1 / 1;
        border-radius: 0.5rem;
        overflow: hidden;
        cursor: pointer;
        box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
        transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
        border: 3px solid transparent;
      }
      
      .image-grid-item.sorted {
        border-color: var(--primary-500);
      }

      .image-grid-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      
      .image-grid-item-overlay-button {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0.25rem 0.6rem;
        background-color: rgba(0, 0, 0, 0.6);
        color: white;
        border-radius: 9999px;
        border: none;
        cursor: pointer;
        opacity: 0;
        transition: opacity 0.2s, transform 0.2s;
        z-index: 5;
        font-size: 0.75rem;
        font-weight: 600;
      }
      .image-grid-item:hover .image-grid-item-overlay-button {
        opacity: 1;
      }
      .image-grid-item-overlay-button:hover {
        transform: scale(1.1);
        background-color: rgba(0, 0, 0, 0.8);
      }

      .image-grid-item-remove-button {
        top: 0.5rem;
        right: 0.5rem;
      }
      
      .image-grid-item-zoom-button {
        top: 0.5rem;
        right: 3rem;
      }
      
      .image-grid-item-badge {
        position: absolute;
        top: 0.5rem;
        left: 0.5rem;
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        font-size: 0.875rem;
        font-weight: 600;
        padding: 0.25rem 0.6rem;
        border-radius: 9999px;
        z-index: 5;
        pointer-events: none;
      }

      .placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 20rem;
        border: 2px dashed var(--border-light);
        border-radius: 0.75rem;
        text-align: center;
        color: var(--text-secondary-light);
      }
      .dark .placeholder {
        border-color: var(--border-dark);
        color: var(--text-secondary-dark);
      }
      
      .modal-overlay {
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0.8);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 1rem;
        animation: fadeIn 0.3s ease;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      .modal-content {
        position: relative;
        max-width: 90vw;
        max-height: 90vh;
        animation: scaleUp 0.3s ease;
      }
      @keyframes scaleUp {
        from { transform: scale(0.9); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
      }
      .modal-image {
        display: block;
        max-width: 100%;
        max-height: 90vh;
        object-fit: contain;
        border-radius: 0.75rem;
      }
      .modal-close-button {
        position: absolute;
        top: -1rem;
        right: -1rem;
        width: 2.5rem;
        height: 2.5rem;
        background-color: white;
        color: black;
        border-radius: 9999px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        font-weight: bold;
        cursor: pointer;
        border: none;
        box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        transition: transform 0.2s;
      }
      .modal-close-button:hover {
        transform: scale(1.1);
      }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.0/FileSaver.min.js"></script>

</script>
</head>

</html>
